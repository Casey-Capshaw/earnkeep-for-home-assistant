name: Sprite trait request
description: A look the Sprite character options don't cover yet.
labels: [sprites]
body:
  - type: markdown
    attributes:
      value: |
        These requests are welcome. Describe the look in words; please don't attach photos of children.
  - type: textarea
    id: missing
    attributes:
      label: What's missing
      description: A hairstyle, an aid, a head covering, a piece of clothing…
    validations:
      required: true
  - type: textarea
    id: nearest
    attributes:
      label: The nearest option today, and why it isn't right
  - type: textarea
    id: description
    attributes:
      label: How it should look
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I haven't attached photos of children.
          required: true
