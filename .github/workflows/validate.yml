name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # 2026.11.0

  hacs:
    name: HACS
    # The HACS action only validates public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # HACS asks for @main: its last tagged release is from 2022.
      - uses: hacs/action@main
        with:
          category: integration
          # Topics, brand assets and a public repo come with the public release.
          ignore: brands topics

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tests
